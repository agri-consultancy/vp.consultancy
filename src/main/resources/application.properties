# ===============================
# Basic Application Details Configuration
# ===============================
spring.application.name=agri-consultation
server.port=8080
server.servlet.context-path=/api

# ===============================
# JWT Configuration
# ===============================
app.jwt.secret=verysecretkeyforjwtdontsharepleasechangeit1234567890
app.jwt.expiration-ms=3600000
app.jwt.refresh-ms=604800000

# ===============================
# DB Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/vp_consultancy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.use-new-id-generator-mappings=false

# ===============================
# Connection Pool (HikariCP)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# Logging Configuration
# ===============================
logging.level.root=INFO
logging.level.com.example.vp.consultancy=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


# ===============================
# Actuator Configuration
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

