# Nginx Configuration for VP Consultancy API
# Production-ready with SSL/TLS

upstream vp_consultancy_app {
    server app:8085;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.agriconsultancy.tech www.api.agriconsultancy.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name api.agriconsultancy.tech www.api.agriconsultancy.tech;

    # SSL Certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.agriconsultancy.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.agriconsultancy.tech/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/agri-consultancy/logs/nginx-access.log combined;
    error_log /var/agri-consultancy/logs/nginx-error.log warn;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_disable "msie6";

    # Buffering
    client_body_buffer_size 128k;
    client_max_body_size 10m;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Location for API
    location /agri-consultancy-service/ {
        proxy_pass http://vp_consultancy_app/agri-consultancy-service/;

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;

        # Keep alive
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Location for Swagger/API Docs
    location /agri-consultancy-service/swagger-ui/ {
        proxy_pass http://vp_consultancy_app/agri-consultancy-service/swagger-ui/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Health check endpoint
    location /agri-consultancy-service/actuator/health {
        proxy_pass http://vp_consultancy_app/agri-consultancy-service/actuator/health;
        access_log off;
    }

    # Block admin endpoints from external access
    location /agri-consultancy-service/actuator/ {
        return 403;
    }

    # Root location
    location / {
        return 404;
    }
}

